<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
	<defs>
		<!-- 单个逗号形镂空 -->
		<path id="comma" d="M205,52
                        C214,64 217,81 210,95
                        C203,107 187,111 177,103
                        C169,96 169,84 176,76
                        C183,68 192,66 197,60
                        C200,56 202,54 205,52 Z"/>
		<!-- 遮罩:白色=保留主体,黑色=挖空 -->
		<mask id="spin">
			<g fill="#fff">
				<circle cx="150" cy="112" r="74"/>
			</g>
			<g fill="#000">
				<circle cx="150" cy="112" r="15"/>
				<use href="#comma"/>
				<use href="#comma" transform="rotate(120 150 112)"/>
				<use href="#comma" transform="rotate(240 150 112)"/>
			</g>
		</mask>
	</defs>
	
	<!-- 白色主体,背景与孔洞均为透明 -->
	<g transform="translate(150 150) scale(1.621622) translate(-150 -112)">
		<rect width="300" height="225" fill="#FFFFFF" mask="url(#spin)"/>
	</g>
</svg>
